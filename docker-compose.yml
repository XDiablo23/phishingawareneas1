services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phish
      POSTGRES_PASSWORD: phish
      POSTGRES_DB: phishawareness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phish -d phishawareness"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://phish:phish@db:5432/phishawareness
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
